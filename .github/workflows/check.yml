# Checks a pull request that adds or changes a distro: the folder and its
# listing (scripts/check_listing.py), then a full build and boot test with the
# pinned linuxlive release. Pull requests from forks get no secrets, so nothing
# is uploaded from here; publish.yml does that after the merge.
name: check

on:
  pull_request:
    paths: ["distros/**"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  listing:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python scripts/check_listing.py "$BASE" "$HEAD" --pr-author "$AUTHOR"

  build:
    name: build (${{ matrix.slug }})
    needs: listing
    if: needs.listing.outputs.build != '[]'
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.listing.outputs.build) }}
    uses: Eric-Ness/linuxlive/.github/workflows/build.yml@v0.8.0
    with:
      spec: distros/${{ matrix.slug }}/linuxlive.yaml
      name: ${{ matrix.slug }}
      keep-iso: false
