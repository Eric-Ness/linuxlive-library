# After a merge to main: builds and boot-tests every distro the push added or
# changed (every distro, when the push changes this file, such as a move to a
# new linuxlive release), then uploads each ISO with its SHA-256 and package list to R2 as
# library/<slug>/<run id>/<slug>.iso (served at downloads.linuxlive.com), plus
# <slug>-arm64.iso beside it when the spec's arches include arm64. A
# distro whose folder was deleted has its ISOs deleted. Monthly (the 3rd, 05:47
# UTC) it rebuilds every distro, so their packages never fall more than a month
# behind. Each distro is published only if its own build passed; one that fails
# keeps its last good ISO and holds back no other. linuxlive.com shows each
# distro's newest run whose publish job for it succeeded.
name: publish

on:
  push:
    branches: [main]
    # This file too: moving it to a new linuxlive release rebuilds every distro.
    paths: ["distros/**", ".github/workflows/publish.yml"]
  schedule:
    - cron: "47 5 3 * *"
  workflow_dispatch:
    inputs:
      slug:
        description: Rebuild and publish this distro (its folder name), or "all"
        required: true
        type: string

permissions:
  contents: read
  # Each publish job reads whether its own distro's build passed.
  actions: read

# One publish at a time, none cancelled: each must finish its uploads.
concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUCKET: ${{ vars.R2_BUCKET || 'linuxlive-downloads' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  # Newer AWS CLIs add checksum headers R2 can reject; send them only when an API requires them.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  listing:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      remove: ${{ steps.check.outputs.remove }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          SLUG: ${{ inputs.slug }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$SLUG" = all ]; then
            python scripts/check_listing.py --all
          elif [ -n "$SLUG" ]; then
            python scripts/check_listing.py --slug "$SLUG"
          elif [ -n "${BEFORE//0/}" ] && git diff --name-only "$BEFORE" HEAD | grep -qx '.github/workflows/publish.yml'; then
            # How distros are built changed (a new linuxlive release): rebuild them all,
            # so every Library page gets a build from the new release.
            python scripts/check_listing.py --all
          elif [ -z "${BEFORE//0/}" ]; then
            # The branch's first push: everything in it is new.
            python scripts/check_listing.py "$(git hash-object -t tree /dev/null)" HEAD --many
          else
            python scripts/check_listing.py "$BEFORE" HEAD --many
          fi

  build:
    name: build (${{ matrix.slug }})
    needs: listing
    if: needs.listing.outputs.build != '[]'
    strategy:
      # One distro's failure must not cancel the others' builds.
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.listing.outputs.build) }}
    # Fedora-based distros publish their system image to ghcr.io, which their
    # installer and installed systems pull from.
    permissions:
      contents: read
      packages: write
    uses: Eric-Ness/linuxlive/.github/workflows/build.yml@v0.9.0
    with:
      spec: distros/${{ matrix.slug }}/linuxlive.yaml
      name: ${{ matrix.slug }}
      keep-iso: true
      iso-retention-days: 1
      publish-image: true

  publish:
    name: publish (${{ matrix.slug }})
    needs: [listing, build]
    # Runs even when another distro's build failed; the first step stops this
    # distro unless its own build passed.
    if: always() && needs.listing.result == 'success' && needs.listing.outputs.build != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.listing.outputs.build) }}
    env:
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: distros/${{ matrix.slug }}/linuxlive.yaml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Each of the spec's arches (linuxlive 0.8.0+; amd64 when it names none)
      # is its own build job and its own ISO: <slug>.iso, and <slug>-<arch>.iso
      # for the others (build.yml names its ARM job "build arm64").
      - name: Which ISOs does this distro have?
        id: arches
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, yaml
          with open(f"distros/{os.environ['SLUG']}/linuxlive.yaml", encoding="utf-8") as f:
              spec = yaml.safe_load(f)
          print("arches=" + " ".join(spec.get("arches") or ["amd64"]))
          PY
      - name: Did this distro's own builds pass?
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHES: ${{ steps.arches.outputs.arches }}
        run: |
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | "\(.name)\t\(.conclusion)"')
          # A distro is published whole: every arch's build must have passed.
          for arch in $ARCHES; do
            job="build ($SLUG) / build"
            [ "$arch" = amd64 ] || job="build ($SLUG) / build $arch"
            state=$(printf '%s\n' "$jobs" | awk -F'\t' -v j="$job" '$1 == j { s = $2 } END { print s }')
            if [ "$state" != success ]; then
              echo "The $arch build of $SLUG ended ${state:-without a result}; its last published ISOs stay." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
      # iso-<slug> and iso-<slug>-arm64; a longer slug that starts the same may
      # match too, but only this distro's exact file names are used below.
      - uses: actions/download-artifact@v7
        with:
          pattern: iso-${{ matrix.slug }}*
          merge-multiple: true
          path: iso
      - name: Check each ISO against its SHA-256
        working-directory: iso
        env:
          ARCHES: ${{ steps.arches.outputs.arches }}
        run: |
          for arch in $ARCHES; do
            f="$SLUG"; [ "$arch" = amd64 ] || f="$SLUG-$arch"
            sha256sum -c "$f.iso.sha256" && test -s "$f.iso.packages"
          done
      - name: Upload to R2
        working-directory: iso
        env:
          ARCHES: ${{ steps.arches.outputs.arches }}
        run: |
          key="library/$SLUG/$GITHUB_RUN_ID"
          # The run id makes every path new, so browsers and Cloudflare may cache it forever.
          cache="public, max-age=31536000, immutable"
          for arch in $ARCHES; do
            f="$SLUG"; [ "$arch" = amd64 ] || f="$SLUG-$arch"
            aws s3 cp "$f.iso" "s3://$BUCKET/$key/$f.iso" --endpoint-url "$R2_ENDPOINT" \
              --content-type application/x-iso9660-image --cache-control "$cache" --no-progress
            aws s3 cp "$f.iso.sha256" "s3://$BUCKET/$key/$f.iso.sha256" --endpoint-url "$R2_ENDPOINT" \
              --content-type text/plain --cache-control "$cache" --no-progress
            aws s3 cp "$f.iso.packages" "s3://$BUCKET/$key/$f.iso.packages" --endpoint-url "$R2_ENDPOINT" \
              --content-type "text/plain; charset=utf-8" --cache-control "$cache" --no-progress
            echo "https://downloads.linuxlive.com/$key/$f.iso ($arch)" >> "$GITHUB_STEP_SUMMARY"
          done

  remove:
    name: remove (${{ matrix.slug }})
    needs: listing
    if: needs.listing.outputs.remove != '[]'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.listing.outputs.remove) }}
    env:
      SLUG: ${{ matrix.slug }}
    steps:
      - name: Delete its ISOs from R2
        run: |
          aws s3 rm "s3://$BUCKET/library/$SLUG/" --recursive --endpoint-url "$R2_ENDPOINT"
          echo "Deleted library/$SLUG/ from R2." >> "$GITHUB_STEP_SUMMARY"
