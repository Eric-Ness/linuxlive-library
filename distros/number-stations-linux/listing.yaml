name: "Number Stations"
author: "Eric-Ness"
tagline: "A ham radio desktop with an FT8 waterfall look, in tribute to the shortwave numbers stations."
about: "Number Stations is an Ubuntu desktop for amateur radio. Gqrx, fldigi, WSJT-X, JS8Call, Gpredict and QLog come installed and pinned to the dock, ready for an SDR, digital modes, satellite passes and logging. The clock runs on UTC, as radio logs do. The look is a pale WSJT-X waterfall with a column of five-digit groups painted into the band, a nod to the numbers stations that still read out coded figures on shortwave. Even the boot splash is a rolling waterfall."
credits: "My own work"
license: "MIT"
website: "https://numberstations.com/"
