# Tiki Head Linux, made with the linuxlive.com wizard on 2026-10-19.
# Build it in your own GitHub from https://github.com/Eric-Ness/linuxlive-distro (see README.md)
schema_version: 1
name: "Tiki Head Linux"
version: "0.5"
base: ubuntu
desktop: gnome
apps:
  - vscode
  - chromium
  - firefox
arches: [amd64, arm64]
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#e0661f"
firefox:
  homepage: "https://tikihead.org/"
# Your own additions. Scripts and repos run as root; read them before you share the distro.
packages:
  - qgis
  - qgis-plugin-grass
  - grass
  - saga
  - gdal-bin
  - proj-bin
  - spatialite-bin
  - spatialite-gui
  - osmium-tool
  - gpsbabel
  - postgresql
  - postgis
  - python3-gdal
  - python3-geopandas
  - python3-rasterio
  - python3-pyproj
  - python3-shapely
  - python3-fiona
  - python3-rtree
  - python3-xarray
  - python3-netcdf4
  - python3-matplotlib
  - python3-folium
  - python3-scipy
  - ipython3
  - jupyter-notebook
  - netcdf-bin
  - josm
  - gnome-maps
  - build-essential
  - libsqlite3-dev
  - zlib1g-dev
  - curl
  - ca-certificates
files:
  - src: files/README.md
    dest: "/usr/share/tiki-head/README.md"
    mode: "0644"
  - src: files/motd
    dest: "/etc/motd"
    mode: "0644"
  - src: files/tiki-head-gis
    dest: "/usr/bin/tiki-head-gis"
    mode: "0755"
scripts:
  build:
    - scripts/build.sh
  first-boot:
    - scripts/first-boot.sh
  first-login:
    - scripts/first-login.sh
